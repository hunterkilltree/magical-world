<style>
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: var(--font-body); }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  .plate { position: fixed; left: 32px; top: 28px; z-index: 5; pointer-events: none; max-width: 34ch; }
  .plate h1 { margin: 0 0 4px; font-family: var(--font-display); font-size: 22px; font-weight: 600;
    letter-spacing: -0.01em; color: var(--ink); }
  .plate p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-soft); text-wrap: pretty; }
  .swap { position: fixed; right: 32px; top: 28px; z-index: 6; display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: flex-end; }
  .chip { font-size: 12px; font-weight: 500; line-height: 1; padding: 9px 14px; border-radius: var(--radius-pill);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); text-decoration: none; }
  .chip:hover { color: var(--brand); border-color: var(--brand); }
  .chip.is-on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  a { color: var(--brand); }
  a:hover { color: var(--ink); }
</style>
