<head>
<meta charset="utf-8">

<style>
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: var(--font-body); }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  .plate { position: fixed; left: 32px; top: 28px; z-index: 5; pointer-events: none; max-width: 34ch; }
  .plate .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
  .plate h1 { margin: 5px 0 6px; font-family: var(--font-display); font-size: 26px; font-weight: 600;
    letter-spacing: -0.015em; color: var(--ink); }
  .plate p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); text-wrap: pretty; }
  .rail { position: fixed; right: 32px; top: 28px; z-index: 6; display: flex; flex-direction: column;
    align-items: stretch; gap: 18px; width: 226px; max-height: calc(100vh - 130px); overflow-y: auto; }
  .rail-label { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 7px; }
  #regions { display: flex; flex-direction: column; align-items: stretch; gap: 7px; }
  .seg { display: flex; gap: 6px; }
  .seg .chip { flex: 1; justify-content: center; padding: 9px 6px; white-space: nowrap; }
  .chip { display: flex; align-items: center; gap: 9px; font-family: var(--font-body); font-size: 12.5px;
    font-weight: 500; line-height: 1; padding: 10px 13px; border-radius: var(--radius-pill);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer; text-align: left; }
  .chip:hover { color: var(--brand); border-color: var(--brand); }
  .chip.is-on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .swatch { width: 9px; height: 9px; border-radius: 999px; flex: 0 0 auto; }
  #legend { display: grid; gap: 6px; padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--line); background: var(--surface); }
  .legend-row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-soft); }
  .links { display: flex; gap: 7px; flex-wrap: wrap; }
  .links a { font-size: 12px; padding: 8px 13px; border-radius: var(--radius-pill); border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-soft); text-decoration: none; }
  .links a:hover { color: var(--brand); border-color: var(--brand); }
  a { color: var(--brand); }
  a:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="plate">
    <div class="kicker" id="r-biome">Full campaign region · 6 zones · 24 nodes</div>
    <h1 id="r-name">Grauhold Reach</h1>
    <p id="r-blurb">Six linked zones on a single landmass, joined by six overland routes. The keep plateau is the campaign hub; the cavern sits below sea level and is reached only through the bog.</p>
  </div>

  <div class="rail">
    <div>
      <div class="rail-label">Camera</div>
      <div class="seg">
        <button class="chip" data-v="top">Top</button>
        <button class="chip is-on" data-v="iso">Isometric</button>
        <button class="chip" data-v="low">Low</button>
      </div>
    </div>
    <div>
      <div class="rail-label">Zones</div>
      <div id="regions"></div>
      <button class="chip" id="r-whole" style="margin-top:7px; justify-content:center">Whole region</button>
    </div>
    <div>
      <div class="rail-label">Node key</div>
      <div id="legend"></div>
    </div>
    <div>
      <div class="rail-label">Project</div>
      <nav class="links">
        <a href="zones.html">Zone maps</a>
        <a href="wizards.html">Wizards</a>
        <a href="arcane-staff.html">Armoury</a>
      </nav>
    </div>
  </div>

  <three-d-stage name="grauhold-reach" background="#f2ece2"></three-d-stage>
  <script src="./three-d-stage.js"></script>
  <script type="module" src="./overworld-model.js"></script>
</body>
</html>
